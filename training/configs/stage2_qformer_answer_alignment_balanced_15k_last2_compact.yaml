qwen3_vl:
  model_name_or_path: models/Qwen3-VL-2B-Instruct
  adapter_name_or_path: training/outputs/llamafactory/stage1_qwen3vl_json_sft_final
  adapter_is_trainable: false
  local_files_only: true
  device_map: auto
  dtype: bfloat16

model:
  pretrained_model_name: Salesforce/blip2-opt-2.7b
  qformer_checkpoint_path: training/pretrained/blip2_qformer/Salesforce_blip2-opt-2.7b/qformer_query.pt
  num_views: 6
  num_frames: 5
  use_camera_embedding: true
  use_temporal_embedding: true
  use_visual_input_layernorm: true
  freeze_qformer: true
  freeze_query_tokens: false

risk_latent:
  answer_loss_weight: 1.0
  risk_loss_weight: 0.0
  cot_loss_weight: 0.0
  risk_head_source: risk_latents
  enable_recurrent_latent_cot: false
  enable_latent_cot: false
  num_cot_steps: 4

data:
  answer_label_policy: stage2_compact_placeholder_json
  train_datasets:
    - json: data/sets/stage2_balanced_15k/nurisk_style/dataset_splits/train_nuscenes.json
      vqa_root: data/sets/nuscenes_full/nurisk_style
    - json: data/sets/stage2_balanced_15k/nurisk_style/dataset_splits/train_waymo.json
      vqa_root: data/sets/waymo/nurisk_style
  validation_datasets:
    - json: data/sets/stage2_balanced_15k/nurisk_style/dataset_splits/validation_nuscenes.json
      vqa_root: data/sets/nuscenes_full/nurisk_style
    - json: data/sets/stage2_balanced_15k/nurisk_style/dataset_splits/validation_waymo.json
      vqa_root: data/sets/waymo/nurisk_style

video_processor:
  fps: 2.0
  raw_fps: 2.0
  reader_backend: torchvision
  min_pixels: 3136
  max_pixels: 12544
  total_pixels: 75264

training:
  output_dir: training/outputs/stage2_qformer_answer_alignment_balanced_15k_last2_compact
  train_llm: frozen
  freeze_video_encoder: true
  train_qformer: true
  qformer_train_last_n_layers: 2
  train_projector: true
  train_risk_latents: false
  train_risk_aux_heads: false
  train_cot_decoder: false
  compute_json_loss: true
  compute_risk_loss: false
  compute_cot_loss: false
  save_qwen_adapter: false
  skip_final_eval: true
  batch_size: 1
  eval_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-4
  qformer_learning_rate: 5.0e-6
  query_tokens_learning_rate: 1.0e-5
  visual_adapter_learning_rate: 1.0e-4
  projector_learning_rate: 1.0e-4
  camera_embedding_learning_rate: 1.0e-4
  temporal_embedding_learning_rate: 1.0e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  num_epochs: 1
  max_steps: null
  max_train_samples: null
  max_validation_samples: null
  eval_max_batches: 20
  log_every: 1
  save_every: 10
  eval_strategy: "no"
  eval_every: 500
  save_total_limit: 3
  max_question_length: 256
  max_answer_length: 384
  max_cot_step_length: 128
  fp16: false
  bf16: true
  gradient_checkpointing: true
  report_to: []
  random_seed: 42
