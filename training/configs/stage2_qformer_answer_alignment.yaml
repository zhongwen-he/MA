qwen3_vl:
  model_name_or_path: models/Qwen3-VL-2B-Instruct
  adapter_name_or_path: training/outputs/llamafactory/stage1_qwen3vl_json_sft_final
  adapter_is_trainable: false
  local_files_only: true
  device_map: auto
  dtype: float16

model:
  pretrained_model_name: Salesforce/blip2-opt-2.7b
  qformer_checkpoint_path: training/pretrained/blip2_qformer/Salesforce_blip2-opt-2.7b/qformer_query.pt
  num_views: 6
  num_frames: 5
  use_camera_embedding: true
  use_temporal_embedding: true
  use_visual_input_layernorm: true
  freeze_qformer: false
  freeze_query_tokens: false

risk_latent:
  answer_loss_weight: 1.0
  risk_loss_weight: 0.0
  cot_loss_weight: 0.0
  risk_head_source: risk_latents
  enable_recurrent_latent_cot: false
  enable_latent_cot: false
  num_cot_steps: 4

data:
  answer_label_policy: full
  train_datasets:
    - json: data/sets/nuscenes_full/nurisk_style/dataset_splits/train.json
      vqa_root: data/sets/nuscenes_full/nurisk_style
    - json: data/sets/waymo/nurisk_style/dataset_splits/train.json
      vqa_root: data/sets/waymo/nurisk_style
  validation_datasets:
    - json: data/sets/nuscenes_full/nurisk_style/dataset_splits/validation.json
      vqa_root: data/sets/nuscenes_full/nurisk_style
    - json: data/sets/waymo/nurisk_style/dataset_splits/validation.json
      vqa_root: data/sets/waymo/nurisk_style

video_processor:
  fps: 2.0
  raw_fps: 2.0
  reader_backend: torchvision

training:
  output_dir: training/outputs/stage2_qformer_answer_alignment
  train_llm: frozen
  freeze_video_encoder: true
  train_qformer: true
  train_projector: true
  train_risk_latents: false
  train_risk_aux_heads: false
  train_cot_decoder: false
  compute_json_loss: true
  compute_risk_loss: false
  compute_cot_loss: false
  save_qwen_adapter: false
  skip_final_eval: true
  batch_size: 1
  eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-4
  qformer_learning_rate: 5.0e-6
  query_tokens_learning_rate: 1.0e-5
  visual_adapter_learning_rate: 1.0e-4
  projector_learning_rate: 1.0e-4
  camera_embedding_learning_rate: 1.0e-4
  temporal_embedding_learning_rate: 1.0e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  num_epochs: 1
  max_steps: null
  max_train_samples: 15000
  max_validation_samples: 200
  eval_max_batches: 20
  log_every: 10
  save_every: 500
  eval_strategy: "no"
  eval_every: 500
  save_total_limit: 3
  max_question_length: 512
  max_answer_length: 896
  max_cot_step_length: 128
  fp16: false
  bf16: true
  gradient_checkpointing: true
  report_to: []
  random_seed: 42
